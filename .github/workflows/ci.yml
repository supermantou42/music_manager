name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare pinned FFmpeg for integration tests
        shell: pwsh
        run: |
          & ./scripts/install-ffmpeg.ps1
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg preparation failed' }
          (Join-Path $env:GITHUB_WORKSPACE 'tools/ffmpeg/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm test
