name: Windows Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: metadata-bridge/go.sum
      - run: node scripts/check-release.cjs
      - name: Verify release notes
        shell: pwsh
        run: |
          $notes = Join-Path 'docs/releases' ($env:GITHUB_REF_NAME + '.md')
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Missing versioned release notes' }
      - run: npm ci
      - name: Prepare pinned FFmpeg for integration tests
        shell: pwsh
        run: |
          & ./scripts/install-ffmpeg.ps1
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg preparation failed' }
          (Join-Path $env:GITHUB_WORKSPACE 'tools/ffmpeg/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm test
      - run: npm run dist:win
      - run: npm run smoke:package
      - run: node scripts/release-checksums.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/MusicManager-*.exe
            dist/MusicManager-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--verify-tag --notes-file "docs/releases/${RELEASE_TAG}.md" --title "MusicManager ${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published files.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* "${args[@]}"
